name: repo_jdh
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ===== 상태 관리 =====
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ===== 라우팅 =====
  go_router: ^15.1.2

  # ===== Firebase =====
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.10

  # ===== 지도 및 위치 (네이버 지도) =====
  flutter_naver_map: ^1.4.4
  geolocator: ^13.0.2
  dart_geohash: ^2.1.0

  # ===== 헬스 데이터 (Android Health Connect) =====
  health: ^13.3.1

  # ===== 백그라운드 GPS (Foreground Service) =====
  flutter_foreground_task: ^8.16.0

  # ===== 카메라 =====
  image_picker: ^1.1.2

  # ===== HTTP 통신 (FastAPI 호출용) =====
  dio: ^5.8.0+1

  # ===== 환경변수 =====
  flutter_dotenv: ^5.2.1

  # ===== AI (Gemini) =====
  google_generative_ai: ^0.4.7

# ===== UI / 애니메이션 (Reflectly 스타일) =====
  flutter_animate: ^4.5.0
  lottie: ^3.1.3
  cached_network_image: ^3.4.1

  # ===== 권한 / 로컬 저장 =====
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.3

  # ===== 유틸 =====
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

  # ===== YOLOv8n 카메라 기능 (sbang0209 추가) =====
  camera: ^0.10.5+9
  http: ^1.2.0
  image: ^4.1.7
  path: ^1.9.0
  google_sign_in: ^6.2.1
  geocoding: ^3.0.0
  flutter_svg: ^2.3.0
  material_symbols_icons: ^4.2928.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.4
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.4
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - .env

  fonts:
    # 메인 폰트 (Pretendard)
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700

    # 로그인 화면
    - family: HumanBeomseokNeo
      fonts:
        - asset: assets/fonts/HumanBeomseokNeo-Medium.ttf

    # 백업 폰트 (나중에 삭제 가능)
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR-VariableFont_wght.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"

flutter_native_splash:
  color: "#E3F6EC"
  image: "assets/images/app_icon.png"
  android_12:
    color: "#E3F6EC"
    image: "assets/images/app_icon.png"